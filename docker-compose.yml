services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: holyai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holyai}
      POSTGRES_DB: holyai
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holyai"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
  storage:
    image: rustfs/rustfs:1.0.4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-holyai}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-storage-secret}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage:/data"]
volumes:
  postgres:
  redis:
  storage:
